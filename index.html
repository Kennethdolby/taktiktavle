<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Taktiktavle Pro v2</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #debugBanner {
      display: none;
      background: #991b1b;
      color: #fff;
      font-size: 12px;
      padding: 6px 10px;
      z-index: 2000;
      flex-shrink: 0;
    }
    header {
      background: #1e293b;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 20;
      gap: 6px;
      flex-shrink: 0;
      width: 100%;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .menu-btn {
      background: #334155;
      border: none;
      color: #f8fafc;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: #38bdf8;
      white-space: nowrap;
    }
    .header-center {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 2px;
      border-radius: 12px;
      border: 1px solid #334155;
      flex-shrink: 0;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tool-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .header-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-icon, .btn-select {
      background: #334155;
      border: none;
      color: #f8fafc;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      padding: 0 8px;
    }

    .side-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 900;
      display: none;
    }
    .side-menu {
      position: fixed;
      top: 50px;
      left: 10px;
      width: 240px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
      z-index: 950;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .side-menu-item {
      background: transparent;
      border: none;
      border-bottom: 1px solid #334155;
      color: #f8fafc;
      padding: 13px 14px;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .side-menu-item:last-child {
      border-bottom: none;
    }

    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .saved-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
    }
    .saved-item-name {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
      word-break: break-word;
    }
    .saved-item-actions {
      display: flex;
      gap: 6px;
    }
    .saved-load-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .saved-del-btn {
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .field-container {
      flex: 1 1 auto;
      min-height: 120px;
      position: relative;
      background: #15803d;
      overflow: hidden;
      width: 100%;
    }
    canvas#pitch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .bench-bar {
      background: #0f172a;
      border-top: 1px solid #334155;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      z-index: 10;
      min-height: 54px;
      flex-shrink: 0;
      width: 100%;
    }
    .bench-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bench-slots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .piece {
      position: absolute;
      z-index: 10;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: move;
      touch-action: none;
    }
    .piece.ball-piece {
      z-index: 30 !important;
    }
    .player-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: white;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 3px 5px rgba(0,0,0,0.35);
    }
